name: formguard-build-test
description: >
  Build, lint, test all three computers in parallel on every push and PR.
  Gates on: integration smoke test (A→B→C chain), Insforge API validation,
  AppSec scan. This pipeline has no deployment steps — it validates only.

triggers:
  - event: push
    branches: ["*"]
  - event: pull_request
    target_branches: [main]

environment: dev

repos:
  backend:
    source: github
    org: "{{secrets.GITHUB_ORG}}"
    repo: formguard-backend
    branch: "{{branch}}"
    working_dir: formguard-backend
  near:
    source: github
    org: "{{secrets.GITHUB_ORG}}"
    repo: formguard-near
    branch: "{{branch}}"
    working_dir: formguard-near

steps:

  # ── Parallel build + test (A, B, C run simultaneously) ──────────────────

  - name: "Computer B — Install & Lint & Test"
    parallel_group: build
    tool: Python
    version: "3.11"
    working_dir: formguard-backend
    commands:
      - python3 -m venv venv
      - ./venv/bin/pip install -r requirements.txt -q
      - ./venv/bin/pip install ruff pytest -q
      - ./venv/bin/ruff check .
      - ./venv/bin/pytest tests/ -q --tb=short || echo "No tests dir yet — skipping"
    env_inject:
      - INSFORGE_API_KEY
      - NEAR_ENDPOINT

  - name: "Computer C — Cargo Build & Test"
    parallel_group: build
    tool: Rust
    working_dir: formguard-near/contracts/formguard
    commands:
      - rustup target add wasm32-unknown-unknown
      - cargo build --target wasm32-unknown-unknown --release
      - cargo test
    cache:
      - path: formguard-near/contracts/formguard/target
        key: cargo-${{ checksum("Cargo.lock") }}

  - name: "Computer C Mock — Validate Mock Server"
    parallel_group: build
    tool: Python
    version: "3.11"
    working_dir: formguard-near/mock-near
    commands:
      - python3 -m venv venv
      - ./venv/bin/pip install flask -q
      - ./venv/bin/python3 -c "import server; print('Mock server import OK')"

  # ── Wait for parallel builds, then integration smoke test ───────────────

  - name: "Start B + C for smoke test"
    depends_on: build
    tool: Custom Script
    commands:
      - cd formguard-near/mock-near && ./venv/bin/python3 server.py &
      - sleep 2
      - cd formguard-backend && NEAR_ENDPOINT=http://127.0.0.1:5001/near ./venv/bin/uvicorn main:app --port 8000 &
      - sleep 3

  - name: "Integration Smoke Test — session create"
    depends_on: "Start B + C for smoke test"
    tool: Custom Script
    commands:
      - >
        SESSION=$(curl -sf -X POST http://localhost:8000/session/create
        -H 'Content-Type: application/json'
        -d '{"patient_name":"CI-Test","program":"knee_rehab","exercise":"squat"}')
      - echo $SESSION | grep -q '"session_id"' || (echo "FAIL: session/create bad response" && exit 1)
      - SESSION_ID=$(echo $SESSION | python3 -c "import sys,json; print(json.load(sys.stdin)['session_id'])")
      - echo "Created session $SESSION_ID"

  - name: "Integration Smoke Test — log_rep"
    depends_on: "Integration Smoke Test — session create"
    tool: Custom Script
    commands:
      - >
        REP=$(curl -sf -X POST http://localhost:8000/tool/log_rep
        -H 'Content-Type: application/json'
        -d "{\"session_id\":\"$SESSION_ID\",\"rep_number\":1,\"form_state\":\"GREEN\",\"quality_score\":90,\"coaching_cue\":\"CI test\",\"pain_level\":0}")
      - echo $REP | grep -q '"ok":.*true' || (echo "FAIL: log_rep bad response" && exit 1)

  - name: "Integration Smoke Test — NEAR attest"
    depends_on: "Integration Smoke Test — log_rep"
    tool: Custom Script
    commands:
      - sleep 3
      - >
        SESSION_DATA=$(curl -sf http://localhost:8000/tool/session/$SESSION_ID)
      - echo $SESSION_DATA | python3 -c
          "import sys,json; d=json.load(sys.stdin); assert len(d['attestations'])>0,'No attestation landed'"
          || (echo "FAIL: attestation missing after log_rep" && exit 1)

  - name: "Integration Smoke Test — flag_for_pt + SSE"
    depends_on: "Integration Smoke Test — NEAR attest"
    tool: Custom Script
    commands:
      - >
        FLAG=$(curl -sf -X POST http://localhost:8000/tool/flag_for_pt
        -H 'Content-Type: application/json'
        -d "{\"session_id\":\"$SESSION_ID\",\"type\":\"pain_spike\",\"rep_number\":1,\"pain_level\":8,\"notes\":\"CI test\"}")
      - echo $FLAG | grep -q '"ok":.*true' || (echo "FAIL: flag_for_pt bad response" && exit 1)

  # ── Insforge API validation (prize-dependency derisk) ───────────────────

  - name: "Insforge API Shape Validation"
    depends_on: "Integration Smoke Test — flag_for_pt + SSE"
    tool: Custom Script
    fail_policy: warn_on_missing_key    # if INSFORGE_API_KEY blank → warn, don't block CI
    commands:
      - |
        if [ -z "$INSFORGE_API_KEY" ]; then
          echo "WARN: INSFORGE_API_KEY not set — skipping real Insforge validation (mock mode)"
          exit 0
        fi
        RESP=$(curl -sf -X GET "$INSFORGE_API_URL/collections"
          -H "x-api-key: $INSFORGE_API_KEY" -H "Content-Type: application/json")
        echo "Insforge reachable. Response: $RESP"
        echo $RESP | python3 -c "import sys,json; json.load(sys.stdin)" || (echo "FAIL: Insforge returned non-JSON" && exit 1)
    env_inject:
      - INSFORGE_API_URL
      - INSFORGE_API_KEY

  # ── API shape drift check against API_CONTRACT.md ──────────────────────

  - name: "API Shape Drift Check"
    depends_on: "Insforge API Shape Validation"
    tool: Custom Script
    commands:
      - |
        PATIENTS=$(curl -sf http://localhost:8000/tool/patients)
        echo $PATIENTS | python3 -c "
        import sys, json
        d = json.load(sys.stdin)
        assert 'patients' in d, 'missing patients key'
        if d['patients']:
            p = d['patients'][0]
            for field in ['patient_id', 'name', 'compliance_score', 'last_session']:
                assert field in p, f'patients[0] missing field: {field}'
        print('Shape OK: GET /tool/patients')
        " || (echo "FAIL: /tool/patients shape drift vs API_CONTRACT.md §1" && exit 1)

  # ── AppSec scan ─────────────────────────────────────────────────────────

  - name: "AppSec Security Scan"
    depends_on: "API Shape Drift Check"
    tool: Opsera Security Scan Agent
    config:
      scan_type: secrets_cves_iac
      fail_on: critical
      paths:
        - formguard-backend
        - formguard-near
      ignore_patterns:
        - "*.env.placeholder"   # placeholder file has no real secrets
        - "venv/**"

  # ── Teardown ─────────────────────────────────────────────────────────────

  - name: "Teardown CI services"
    always_run: true
    tool: Custom Script
    commands:
      - pkill -f "uvicorn main:app" || true
      - pkill -f "server.py" || true

notifications:
  on_failure:
    slack: "{{secrets.SLACK_WEBHOOK_URL}}"
    message: "FormGuard build-test FAILED on {{branch}} — {{step_name}}: {{error}}"
  on_success:
    slack: "{{secrets.SLACK_WEBHOOK_URL}}"
    message: "FormGuard build-test PASSED on {{branch}}"
