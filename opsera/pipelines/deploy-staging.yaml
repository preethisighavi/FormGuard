name: formguard-deploy-staging
description: >
  Deploy all three computers to staging on every merge to main.
  Order: C (NEAR relay) first, then B (Backend), then A (Frontend).
  Insforge and NEAR must both be reachable before A goes live.

triggers:
  - event: push
    branches: [main]

environment: staging

depends_on_pipeline: formguard-build-test   # must be green before deploy runs

steps:

  # ── 1. Deploy Computer C (NEAR mock / relay) ─────────────────────────

  - name: "Deploy Computer C — NEAR Relay"
    tool: Custom Script
    description: >
      In staging this restarts the mock server (or real signing relay if
      NEAR_ACCOUNT_ID is set). Both listen on port 5001 with identical shapes.
    commands:
      - pkill -f "server.py" || true
      - |
        if [ -n "$NEAR_ACCOUNT_ID" ] && [ -n "$NEAR_PRIVATE_KEY" ]; then
          echo "Starting real signing relay..."
          cd formguard-near/relay
          pip install flask near-api-py -q
          nohup python3 server.py > /tmp/near-relay.log 2>&1 &
        else
          echo "Starting mock NEAR server..."
          cd formguard-near/mock-near
          nohup ./venv/bin/python3 server.py > /tmp/near-mock.log 2>&1 &
        fi
      - sleep 3
      - curl -sf http://localhost:5001/health || (echo "FAIL: Computer C not healthy" && exit 1)
    env_inject:
      - NEAR_ACCOUNT_ID
      - NEAR_PRIVATE_KEY
      - NEAR_CONTRACT_ID
      - NEAR_NETWORK

  # ── 2. Deploy Computer B (Backend) ───────────────────────────────────

  - name: "Deploy Computer B — FastAPI Backend"
    depends_on: "Deploy Computer C — NEAR Relay"
    tool: Python
    version: "3.11"
    working_dir: formguard-backend
    commands:
      - pkill -f "uvicorn main:app" || true
      - ./venv/bin/pip install -r requirements.txt -q
      - nohup ./venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
      - sleep 4
      - curl -sf http://localhost:8000/health || (echo "FAIL: Computer B not healthy" && exit 1)
    env_inject:
      - INSFORGE_API_URL
      - INSFORGE_API_KEY
      - NEAR_ENDPOINT

  # ── 3. Insforge round-trip (gate before A goes live) ─────────────────

  - name: "Insforge Post-Deploy Round-Trip"
    depends_on: "Deploy Computer B — FastAPI Backend"
    tool: Custom Script
    commands:
      - |
        SESSION=$(curl -sf -X POST http://localhost:8000/session/create \
          -H 'Content-Type: application/json' \
          -d '{"patient_name":"Opsera-DeployCheck","program":"knee_rehab","exercise":"squat"}')
        SESSION_ID=$(echo $SESSION | python3 -c "import sys,json; print(json.load(sys.stdin)['session_id'])")
        curl -sf -X POST http://localhost:8000/tool/log_rep \
          -H 'Content-Type: application/json' \
          -d "{\"session_id\":\"$SESSION_ID\",\"rep_number\":1,\"form_state\":\"GREEN\",\"quality_score\":90,\"coaching_cue\":\"deploy check\",\"pain_level\":0}"
        sleep 3
        DATA=$(curl -sf http://localhost:8000/tool/session/$SESSION_ID)
        echo $DATA | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['reps'], 'No reps persisted'"
        echo "Insforge round-trip OK — data persists in staging"

  # ── 4. Deploy Computer A (Frontend) ──────────────────────────────────

  - name: "Deploy Computer A — React Frontend"
    depends_on: "Insforge Post-Deploy Round-Trip"
    tool: Node.js
    version: "20"
    working_dir: formguard-frontend
    commands:
      - npm ci
      - npm run build
      # Serve static build for staging (swap for S3/Render in prod)
      - pkill -f "vite preview" || true
      - nohup npm run preview -- --port 5173 --host > /tmp/frontend.log 2>&1 &
      - sleep 3
      - curl -sf http://localhost:5173 || (echo "FAIL: Computer A not responding" && exit 1)
    env_inject:
      - VITE_BACKEND_URL
      - VITE_GEMINI_API_KEY
      - VITE_USE_MOCK

  # ── 5. Post-deploy shape drift check ─────────────────────────────────

  - name: "Post-Deploy API Shape Check"
    depends_on: "Deploy Computer A — React Frontend"
    tool: Custom Script
    commands:
      - |
        python3 - <<'EOF'
        import urllib.request, json, sys

        checks = [
          ("http://localhost:8000/tool/patients",
           lambda d: all(f in d['patients'][0] for f in ['patient_id','name','compliance_score','last_session'])
           if d.get('patients') else True,
           "GET /tool/patients shape"),
          ("http://localhost:8000/health",
           lambda d: d.get('status') == 'ok',
           "GET /health"),
        ]

        failed = []
        for url, validator, label in checks:
          try:
            with urllib.request.urlopen(url) as r:
              data = json.loads(r.read())
            if not validator(data):
              failed.append(f"Shape mismatch: {label}")
          except Exception as e:
            failed.append(f"Unreachable: {label} — {e}")

        if failed:
          print("SHAPE DRIFT DETECTED:")
          for f in failed: print(" •", f)
          sys.exit(1)

        print("All shape checks passed")
        EOF

notifications:
  on_failure:
    slack: "{{secrets.SLACK_WEBHOOK_URL}}"
    message: "STAGING DEPLOY FAILED — {{step_name}}: {{error}}. Check /tmp/*.log on staging host."
  on_success:
    slack: "{{secrets.SLACK_WEBHOOK_URL}}"
    message: "Staging deploy complete. All 3 computers healthy. Insforge round-trip OK."
